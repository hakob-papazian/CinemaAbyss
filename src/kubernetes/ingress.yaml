apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cinemaabyss-ingress
  namespace: cinemaabyss
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - host: cinemaabyss.example.com
      http:
        paths:
          # Домен events уже полностью вынесен из монолита - идёт напрямую в events-service,
          # минуя Gateway (должен стоять раньше "/", иначе его перехватит общий префикс).
          - path: /api/events
            pathType: Prefix
            backend:
              service:
                name: events-service
                port:
                  number: 8082
          # Всё остальное (movies, users, payments, subscriptions, /health) идёт через
          # proxy-service - единую точку входа, реализующую Strangler Fig для /api/movies.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: proxy-service
                port:
                  number: 8000
