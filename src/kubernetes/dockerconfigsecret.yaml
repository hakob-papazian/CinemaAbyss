apiVersion: v1
kind: Secret
metadata:
  name: dockerconfigjson
  namespace: cinemaabyss
data:
  # Образы в этом проекте публичные (ghcr.io/hakob-papazian/cinemaabyss/*), поэтому
  # реальный токен не требуется - ниже валидный, но пустой dockerconfigjson
  # (echo -n '{"auths":{"ghcr.io":{}}}' | base64), чтобы Secret вообще мог примениться.
  # Если сделаете пакеты приватными - замените это значение на base64 от ~/.docker/config.json
  # с настоящим PAT (scope read:packages), как описано в Project_template.md.
  .dockerconfigjson: eyJhdXRocyI6eyJnaGNyLmlvIjp7fX19
type: kubernetes.io/dockerconfigjson
